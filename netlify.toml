# إعداد نشر Netlify — الموقع ثابت داخل مجلد site
[build]
  publish = "site"
  command = ""

# ترويسات الأمان على كل مسار
[[headers]]
  for = "/*"
  [headers.values]
    # يمنع وضع الموقع في إطار على موقع آخر (نقر مخطوف)
    X-Frame-Options = "DENY"
    # يمنع المتصفح من تخمين نوع الملف خلافاً للمُعلَن
    X-Content-Type-Options = "nosniff"
    # لا يسرّب المسار الكامل للمواقع الخارجية عند الخروج
    Referrer-Policy = "strict-origin-when-cross-origin"
    # الموقع لا يحتاج كاميرا ولا ميكروفون ولا موقعاً جغرافياً
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# سياسة المحتوى: قائمة بيضاء بما يحتاجه الموقع فعلاً لا أكثر.
# supabase.co للقاعدة (المنيو والتقييم واللوحة)، وgoogle للخريطة
# المضمَّنة، وdata: للخطوط والصور المضمَّنة في المعاينات.
# frame-ancestors هنا لا في X-Frame-Options وحدها لأن الأولى أدق.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self'; \
      style-src 'self' 'unsafe-inline'; \
      img-src 'self' data: https://*.supabase.co; \
      font-src 'self'; \
      connect-src 'self' https://*.supabase.co; \
      frame-src https://maps.google.com https://www.google.com; \
      form-action 'self'; \
      base-uri 'self'; \
      object-src 'none'; \
      frame-ancestors 'none'"""

# لوحة التحكم خارج الفهرسة بترويسة لا بوسم فقط.
# الوسم <meta name="robots"> في الصفحة يشتغل فقط لو عرضها الزاحف،
# والترويسة تشتغل دائماً. والسبب أن الصفحة نموذجُ دخولٍ عارٍ على
# دومين مقهى — وهذا بالضبط شكلُ ما تبحث عنه مرشّحات التصيّد، وقد
# أُعلِّم الدومين بها فعلاً (سجلٌّ موروث من مالكٍ سابق).
#
# ولا تُذكر في robots.txt عمداً لسببين: Disallow يُشهر مكانَ اللوحة
# لكل من قرأ الملف، وهو أيضاً يمنع الزاحف من رؤية noindex أصلاً —
# فلا يُستبعد ما لا يُقرأ. الصحيح: دعه يزحف، وقل له لا تُفهرِس.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# صفحات HTML تُقدَّم دائماً طازجة (لا كاش قديم على الجوال)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS/JS مُدارة بأرقام إصدارات (?v=N) — كاش سنة كاملة، وأي تعديل يرفع الرقم
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# الصور: كاش أسبوع مع إعادة تحقق بالخلفية
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
